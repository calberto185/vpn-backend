name: Deploy to VPS

on:
  push:
    branches:
      - master   # se dispara solo al hacer push a master

jobs:
  deploy:
    name: SSH Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host:        ${{ secrets.VPS_HOST }}
          username:    ${{ secrets.VPS_USER }}
          key:         ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e

            REPO_DIR="/root/backend"
            REPO_URL="https://github.com/calberto185/vpn-backend.git"

            # Primera vez: clonar; siguientes: pull
            if [ ! -d "$REPO_DIR/.git" ]; then
              echo "▶ Primera vez: clonando repo..."
              git clone -b master "$REPO_URL" "$REPO_DIR"
            else
              echo "▶ Actualizando código..."
              git -C "$REPO_DIR" pull origin master
            fi

            cd "$REPO_DIR"

            # Crear .env si no existe (copia del example)
            if [ ! -f ".env" ]; then
              echo "⚠ No hay .env — copiando .env.example (edítalo después)"
              cp .env.example .env
            fi

            echo "▶ Rebuilding containers..."
            docker compose up -d --build --remove-orphans

            echo "▶ Cleaning unused images..."
            docker image prune -f

            echo "✅ Deploy completado"
